<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snitap - Patins</title>
    <link rel="stylesheet" href="/styles/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Syne:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Syne:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <a href="#logo">
        <img src="assets/logo.svg" alt="logo" />
      </a>
      <a href="#shopping">
        <img src="assets/icons/shopping-bag.svg" alt="icone de sacola" />
        <span>1</span>
      </a>
    </header>

    <section class="hero">
      <div>
        <h1>
          Snitap, sua vida mais
          <div>
            <span>radical!</span>
            <span>divertida!</span>
            <span>saudável!</span>
            <span>radical!</span>
          </div>
        </h1>
      </div>
    </section>

    <div class="buttons">
      <a href="#lojas" class="button buy shadow">
        <img
          src="assets/icons/shopping-bag.svg"
          alt="Sacola de compras preta com alças e um pequeno símbolo de mais no centro"
        />
        COMPRAR AGORA
      </a>

      <a href="#galeria" class="button play">
        <span class="shadow">
          <img src="assets/icons/play.svg" alt="" />
        </span>
        VEJA EM AÇÃO
      </a>
    </div>

    <div>
      <div class="content">
        <img src="assets/hero/ellipse.svg" alt="" />
        <img src="assets/hero/patins-image.png" alt="" />
        <img src="assets/hero/stars-1.svg" alt="">
        <img src="assets/hero/stars-2.svg" alt="">
      </div>
    </div>
    <div class="ribbon-space" aria-hidden="true">
      <div class="ribbon">
        <div class="ribbon-track">
          <span class="ribbon-item"
            >Patins <img src="/assets/Stars 1.svg" alt=""
          /></span>
          <span class="ribbon-item"
            >Patins <img src="/assets/fb315.svg" alt=""
          /></span>
          <span class="ribbon-item"
            >Patins <img src="/assets/fb315.svg" alt=""

          <span class="ribbon-item"

          <span class="ribbon-item"

          <span class="ribbon-item"

          /></span>
          <span class="ribbon-item"
            >Patins <img src="/assets/fb315.svg" alt=""
          /></span>
          <span class="ribbon-item"
            >Patins <img src="/assets/fb315.svg" alt=""
          /></span>
          <span class="ribbon-item"
            >Patins <img src="/assets/fb315.svg" alt=""
          /></span>
          <span class="ribbon-item"
            >Patins <img src="/assets/fb315.svg" alt=""
          /></span>
          <span class="ribbon-item"
            >Patins <img src="/assets/fb315.svg" alt=""
          /></span>
        </div>
      </div>
    </div>

    <section class="gallery" id="galeria">
      <header class="gallery-heading">
        <p>Galeria de fotos</p>
        <h2>#usesnitap por aí</h2>
      </header>
      <div class="gallery-grid">
        <figure class="gallery-card gallery-card-1">
          <img src="/assets/e2efb.png" alt="Pessoa patinando em uma quadra" />
        </figure>
        <figure class="gallery-card gallery-card-2">
          <img
            src="/assets/0fc0a.png"
            alt="Grupo de pessoas patinando em um parque"
          />
        </figure>
        <figure class="gallery-card gallery-card-3">
          <img src="/assets/baa3c.png" alt="Pessoa amarrando os patins" />
        </figure>
        <figure class="gallery-card gallery-card-4">
          <img src="/assets/0f70f.png" alt="Patinadora vista de cima" />
        </figure>
      </div>
    </section>

    <footer class="footer">
      <a class="logo" href="#root" aria-label="Snitap - início">
        <img src="/assets/a1116.svg" alt="" width="32" height="32" />
        <span>Snitap</span>
      </a>
      <nav class="footer-menu" aria-label="Navegação do rodapé">
        <a href="#sobre">Sobre</a>
        <a href="#lojas" id="lojas">Nossas lojas</a>
        <a href="#privacidade">Política de privacidade</a>
      </nav>
      <div class="social-links">
        <a href="https://www.instagram.com/">
          <img
            src="/assets/mdi_instagram.svg"
            alt="Instagram"
            width="24"
            height="24"
          />
        </a>
        <a href="https://www.facebook.com/" aria-label="Facebook">
          <img
            src="/assets//ic_baseline-facebook.svg"
            alt="Facebook"
            width="24"
            height="24"
          />
        </a>
        <a href="https://www.youtube.com/" aria-label="YouTube">
          <img
            src="/assets/mdi_youtube.svg"
            alt="YouTube"
            width="24"
            height="24"
          />
        </a>
        <a href="https://www.tiktok.com/" aria-label="TikTok">
          <img
            src="/assets/ic_baseline-tiktok.svg"
            alt="TikTok"
            width="24"
            height="24"
          />
        </a>
      </div>
    </footer>
